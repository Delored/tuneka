name: CI and release

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Tk test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3-tk xvfb
      - name: Run unit and UI regression tests
        run: xvfb-run --auto-servernum python3 -m unittest discover --start-directory tests --pattern 'test_*.py' --verbose

  build-deb:
    name: Build Debian package (${{ matrix.arch }})
    needs: tests
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build and validate Debian package
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Version must look like v1.2.3 or v1.2.3-rc.1" >&2
              exit 1
            fi
            package_version=${RELEASE_VERSION#v}
          else
            package_version="0.0.0~ci${GITHUB_RUN_NUMBER}"
          fi
          sh packaging/debian/build-deb.sh "$package_version"
          package="dist/tuneka_${package_version}_${{ matrix.arch }}.deb"
          test -s "$package"
          test "$(dpkg-deb --field "$package" Architecture)" = "${{ matrix.arch }}"
          dpkg-deb --contents "$package"
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: tuneka-deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows packages (x64)
    needs: tests
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master'
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build portable application
        run: pyinstaller --noconfirm --clean --windowed --onedir --name Tuneka --icon assets/tuneka.ico --add-data "assets/tuneka.png;assets" app.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Add documentation and build installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          Copy-Item README.md, LICENSE, assets/tuneka.ico -Destination dist/Tuneka/
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $version = $env:RELEASE_VERSION.TrimStart('v')
          } else {
            $version = "0.0.0-ci$env:GITHUB_RUN_NUMBER"
          }
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found at $compiler"
          }
          & $compiler "/DAppVersion=$version" packaging/windows/Tuneka.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          if ((Get-Item dist/Tuneka-Setup-x64.exe).Length -le 0) {
            throw "The Windows installer is empty."
          }
      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Tuneka -DestinationPath dist/Tuneka-windows-x64.zip
          if ((Get-Item dist/Tuneka-windows-x64.zip).Length -le 0) {
            throw "The Windows portable ZIP is empty."
          }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: tuneka-windows-x64-installer
          path: dist/Tuneka-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: tuneka-windows-x64
          path: dist/Tuneka-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: [build-deb, build-windows]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out master
        uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tuneka-*
          path: dist
          merge-multiple: true
      - name: Create release from master
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          test "${GITHUB_REF}" = "refs/heads/master"
          test "$(find dist -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 2
          test -s dist/Tuneka-windows-x64.zip
          test -s dist/Tuneka-Setup-x64.exe
          gh release create "$RELEASE_VERSION" dist/*.deb dist/*.zip dist/*.exe \
            --target master \
            --title "Tuneka $RELEASE_VERSION" \
            --generate-notes
